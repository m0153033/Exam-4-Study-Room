<style>

  --p1:#2a78d6; --p2:#eb6834; --p3:#1baf7a; --p4:#eda100; --p5:#e87ba4; --p6:#008300;

}

<script>
/* Question bank lives in questions.js. Older-style wrong-answer notes (WHY) still merge in if present. */
if (typeof WHY === "object") BANK.forEach(q => { if (!q.w && WHY[q.id]) q.w = WHY[q.id]; });
const isHi = (t, c) => !!(HI[t] && HI[t].includes(c));
const qCount = t => BANK.filter(q => q.t === t).length;
const READY = Object.keys(TOPICS).filter(t => qCount(t) > 0);
/* ===== ENGINE: pure helpers (no DOM) ===== */
const BYID = Object.fromEntries(BANK.map(q => [q.id, q]));
function hash(str){ let h = 2166136261 >>> 0; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let a = hash(String(seed)); return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffled(arr, seed){ const r = rng(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rt(x, d){ const f = Math.pow(10, d); return Math.round(Number((x * f).toPrecision(12))) / f; }
function nf(x){ return Number(x).toLocaleString("en-US", { maximumFractionDigits: 4 }); }
function tr(x){ const r = rt(x, 4); return nf(r) + (Math.abs(x - r) > 1e-9 ? "…" : ""); }
const RL = ["Round to the whole number", "Round to the tenths", "Round to the hundredths"];

function getQ(id){ return BYID[id]; }
function optOrder(q, sess){ return q.type === "num" ? null : shuffled(q.o.map((_, i) => i), sess + "|" + q.id); }
function parseNum(v){ const s = String(v == null ? "" : v).replace(/,/g, "").trim(); if (!/^-?\d*\.?\d+$/.test(s)) return NaN; return parseFloat(s); }
function grade(q, a){
  if (a == null || a === "") return false;
  if (q.type === "mc") return a === q.a;
  if (q.type === "sata"){ if (!Array.isArray(a)) return false; const s = [...a].sort((x, y) => x - y), k = [...q.a].sort((x, y) => x - y); return s.length === k.length && s.every((v, i) => v === k[i]); }
  const v = parseNum(a); return isFinite(v) && Math.abs(v - q.a) < 1e-9;
}
function whyHTML(q, sess){
  if (q.type === "num") return q.mw ? `<div class="why"><h4>Common mistakes</h4><ul><li>${esc(q.mw.replace(/^Common mistakes:\s*/, ""))}</li></ul></div>` : "";
  if (!q.w || !q.w.length) return "";
  const keys = q.type === "mc" ? [q.a] : q.a, wrongIdx = q.o.map((_, i) => i).filter(i => !keys.includes(i));
  const why = {}; wrongIdx.forEach((i, n) => { if (q.w[n]) why[i] = q.w[n]; });
  const ord = optOrder(q, sess) || q.o.map((_, i) => i);
  const items = ord.map((o, pos) => why[o] ? `<li><b>${String.fromCharCode(65 + pos)}.</b> <span class="opt-t">${esc(q.o[o])}</span> — ${esc(why[o])}</li>` : "").filter(Boolean).join("");
  return items ? `<div class="why"><h4>${q.type === "sata" ? "Why the others don't belong" : "Why the other choices are wrong"}</h4><ul>${items}</ul></div>` : "";
}
function correctText(q, sess){
  if (q.type === "num") return `${nf(q.a)} ${q.unit}`;
  const ord = optOrder(q, sess), keys = q.type === "mc" ? [q.a] : q.a;
  return ord.map((o, i) => keys.includes(o) ? `${String.fromCharCode(65 + i)}. ${q.o[o]}` : null).filter(Boolean).join(" · ");
}
function answerText(q, a, sess){
  if (a == null || a === "") return "—";
  if (q.type === "num") return `${a} ${q.unit}`;
  const ord = optOrder(q, sess), arr = Array.isArray(a) ? a : [a];
  return arr.map(o => String.fromCharCode(65 + ord.indexOf(o))).sort().join(", ");
}

/* Deck: every concept in the chosen topics once per game, freshest questions first.
   seen = {id: times asked on this device}; ties broken by a per-game shuffle so repeats rotate. */
function freshest(pool, seen, seed){
  const order = shuffled(pool.map(q => q.id), seed);
  return order.sort((a, b) => (seen[a] || 0) - (seen[b] || 0));
}
function buildDeck(topics, mode, sess, seen){
  seen = seen || {};
  const per = {};
  for (const t of topics){
    if (t === "math") continue;
    per[t] = Object.keys(CONCEPTS[t]).map(c => freshest(BANK.filter(q => q.t === t && q.c === c), seen, sess + t + c)).filter(l => l.length);
  }
  const math = topics.includes("math") ? MATH_TEMPLATES.map((m, i) => `g~${m}~${sess}m${i}`) : [];
  if (mode === "quick"){
    const by = {};
    for (const t of Object.keys(per)) by[t] = shuffled(per[t].map(l => l[0]), sess + "q" + t).sort((a, b) => (seen[a] || 0) - (seen[b] || 0) || (isHi(t, getQ(b).c) - isHi(t, getQ(a).c)));
    if (math.length) by.math = shuffled(math, sess + "qm");
    const out = []; let added = true;
    while (out.length < 25 && added){ added = false; for (const t of topics){ if (by[t] && by[t].length && out.length < 25){ out.push(by[t].shift()); added = true; } } }
    return shuffled(out, sess + "quick");
  }
  const ids = [];
  for (const t of Object.keys(per)) for (const l of per[t]){ ids.push(l[0]); if (l.length > 1 && isHi(t, getQ(l[0]).c)) ids.push(l[1]); }
  return shuffled(ids.concat(math), sess + "deck");
}
function pickFollowup(q, queue, sess, n, seen){
  if (q.t === "math") return `g~${q.c}~${sess}f${n}`;
  seen = seen || {};
  const used = new Set(queue);
  const pool = BANK.filter(x => x.t === q.t && !used.has(x.id));
  const same = pool.filter(x => x.c === q.c);
  const src = same.length ? same : pool;
  if (!src.length) return null;
  return freshest(src, seen, sess + q.id + n)[0];
}

/* Summary for end screen */
function summarize(G){
  const topics = G.topics;
  const asked = G.revealed.map(getQ);
  const tp = topics.map(t => {
    const total = Object.keys(CONCEPTS[t]).length;
    const covered = new Set(asked.filter(q => q.t === t).map(q => q.c)).size;
    return [t, covered, total];
  });
  const keys = Object.keys(G.players);
  const pl = keys.map(k => {
    const per = {}; let c = 0, n = 0;
    for (const q of asked){
      const a = (G.ans[k] || {})[q.id]; if (a == null || a === "") continue;
      const ok = grade(q, a); per[q.t] = per[q.t] || [0, 0]; per[q.t][1]++; n++; if (ok){ per[q.t][0]++; c++; }
    }
    return [G.players[k].n, G.players[k].c, c, n, per, k];
  });
  return { tp, pl };
}

</script>
<script>
/* ---------- room passwords ---------- */
const PW_WORDS = ["MAPLE","OTTER","CEDAR","PLUM","RIVER","HONEY","TULIP","PANDA","LEMON","OCEAN","FERN","BIRCH","CORAL","PEACH","MANGO","KOALA","ROBIN","OLIVE","SPARK","CLOUD","GRAPE","TIGER","MOOSE","BEACH","PIANO","CANDY","DAISY","EAGLE","FROST","GUAVA","HAZEL","IVORY","JELLY","KIWI","LILAC","MELON","NOVA","ORBIT","PEARL","QUILT","RAVEN","SALSA","TOAST","UMBER","VELVET","WALRUS","YARN","ZEBRA","ACORN","BAGEL","CAMEL","DONUT","EMBER","FLUTE","GECKO","HIPPO","IGLOO","JUMBO","KAYAK","LLAMA","MOCHA","NACHO","OPAL","PECAN","QUAIL","RHINO","SUSHI","TACO","WAFFLE","BREEZE","CASTLE","DRAGON","FALCON","GINGER","HARBOR","JIGSAW","KETTLE","LAGOON","MUFFIN","NUTMEG","ORCHID","PEPPER","PUFFIN","ROCKET","SAFARI","TEAPOT","TURTLE","VIOLET","WIZARD","BANJO","COMET","DINGO","FIGS","GLOW","HALO","JADE","KITE","LYNX","MINT","NEST","OWL","PINE","RUBY","SAGE","WREN"].filter(w => w.length >= 4 && w.length <= 6);
function newPw(){ let n = Math.random(); try{ const u = new Uint32Array(1); crypto.getRandomValues(u); n = u[0] / 4294967296; }catch(e){} return PW_WORDS[Math.floor(n * PW_WORDS.length)]; }
const normPw = s => String(s || "").trim().toUpperCase().replace(/[^A-Z]/g, "");
const pwLock = (sess, pw) => hash("e4lock|" + sess + "|" + normPw(pw));
const pwKey = (sess, pid, pw) => hash("e4key|" + sess + "|" + pid + "|" + normPw(pw));
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = { get(k, d){ try{ const v = localStorage.getItem("pn3e4_" + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem("pn3e4_" + k, JSON.stringify(v)); }catch(e){} }, del(k){ try{ localStorage.removeItem("pn3e4_" + k); }catch(e){} } };
const PC = n => `var(--p${(n % 6) + 1})`;
const letter = i => String.fromCharCode(65 + i);
const newId = () => Math.random().toString(36).slice(2, 8);

/* ---------- app state ---------- */
const S = {
  view: "home",          // home | name | setup | lobby | join | play | end
  role: null,            // solo | host | player
  nick: LS.get("nick", ""),
  pid: LS.get("pid", null) || (() => { const id = "p" + newId() + newId(); LS.set("pid", id); return id; })(),
  hostPlays: true,
  pendingRole: null,
  room: null, db: null, user: null, perms: null,
  roomState: "connecting", dbState: "connecting",
  G: null,               // engine state when this device runs the game
  H: null,               // host state when this device is a player
  hostSess: null,
  dbLive: [], dbAns: [],
  draft: null, sent: {}, myVote: {},
  hist: LS.get("hist", {}),
  seen: LS.get("seen", {}),
  openRev: new Set(),         // review sections the viewer opened (stay open across refreshes)   // question id -> times asked on this device (drives fresh-first decks)
  setup: { topics: READY.slice(), mode: "full" },
  keys: LS.get("keys", {}),   // sess -> password this device entered
  unlock: null, pwErr: ""
};

/* ---------- connection: direct device-to-device, no accounts needed ----------
   The host's browser listens at an address made from the room password.
   Players type the password, connect straight to the host, and swap small status messages. */
const PEER_PREFIX = "pn3-exam4-studyroom-v1-";
const NET = { peer: null, mode: null, pw: null, conns: new Map(), remote: new Map(), retry: null, tries: 0 };
S.room = { peers(){ return [...NET.remote.values()].map(p => ({ presence: p, sameTab: false })); } };
S.roomState = "idle"; S.dbState = "none"; S.db = null;
let ansUnsub = null;
function subscribeAns(){}
function dbPut(){}

const MIRROR = {};
function pres(patch){
  const before = JSON.stringify(MIRROR);
  for (const k in patch){ if (patch[k] === null) delete MIRROR[k]; else MIRROR[k] = patch[k]; }
  if (JSON.stringify(MIRROR) === before) return;
  netSendAll();
}
function netSend(conn){ try{ if (conn && conn.open) conn.send({ k: "pres", p: MIRROR }); }catch(e){} }
function netSendAll(){ for (const c of NET.conns.values()) netSend(c); }
function netReady(){ return typeof Peer === "function"; }
function newPeer(id){ const o = { debug: 0 }; return id ? new Peer(id, o) : new Peer(o); }
function wireConn(conn){
  conn.on("open", () => {
    NET.conns.set(conn.peer, conn);
    if (NET.mode === "player"){ S.roomState = "on"; NET.tries = 0; }
    netSend(conn); renderStatus(); onSync();
  });
  conn.on("data", d => {
    if (!d || d.k !== "pres" || !d.p || typeof d.p !== "object") return;
    NET.remote.set(conn.peer, d.p);
    if (NET.mode === "player" && S.role !== "player") checkJoined();
    onSync();
  });
  const gone = () => {
    if (NET.conns.get(conn.peer) === conn) NET.conns.delete(conn.peer);
    NET.remote.delete(conn.peer);
    if (NET.mode === "player"){ S.roomState = "off"; scheduleRejoin(); }
    onSync(); renderStatus();
  };
  conn.on("close", gone); conn.on("error", gone);
}
function netStop(){
  clearTimeout(NET.retry); NET.retry = null; clearTimeout(S.joinTimer);
  const p = NET.peer; NET.peer = null;
  try{ p && p.destroy(); }catch(e){}
  NET.mode = null; NET.pw = null; NET.conns.clear(); NET.remote.clear();
  S.roomState = "idle"; renderStatus();
}
function keepAlive(peer){
  peer.on("disconnected", () => {
    if (NET.peer !== peer || peer.destroyed) return;
    if (NET.mode === "host"){ S.roomState = "connecting"; renderStatus(); }
    setTimeout(() => { try{ if (NET.peer === peer && !peer.destroyed && peer.disconnected) peer.reconnect(); }catch(e){} }, 2000);
  });
}

/* ----- host ----- */
function startHost(){
  const G = S.G; if (!G || G.role !== "host") return;
  if (NET.mode === "host" && NET.pw === G.pw && NET.peer && !NET.peer.destroyed) return;
  netStop();
  if (!netReady()){ S.roomState = "err"; render(); return; }
  NET.mode = "host"; NET.pw = G.pw; S.roomState = "connecting"; renderStatus();
  const peer = NET.peer = newPeer(PEER_PREFIX + G.pw);
  keepAlive(peer);
  peer.on("open", () => { if (NET.peer !== peer) return; S.roomState = "on"; NET.tries = 0; render(); broadcast(true); });
  peer.on("connection", conn => { if (NET.peer === peer) wireConn(conn); });
  peer.on("error", err => {
    if (NET.peer !== peer) return;
    const t = err && err.type;
    if (t === "unavailable-id"){
      /* Another open room is using this word (or this room's old tab hasn't let go yet). */
      const G2 = S.G; if (!G2 || G2.role !== "host") return;
      NET.tries++;
      if (G2.phase === "lobby" || NET.tries > 3){ G2.pw = newPw(); saveG(); NET.tries = 0; netStop(); startHost(); render(); }
      else setTimeout(() => { if (NET.peer === peer){ netStop(); startHost(); } }, 4000);
      return;
    }
    if (t === "browser-incompatible"){ S.roomState = "err"; render(); return; }
    if (t === "peer-unavailable") return;
    S.roomState = "off"; renderStatus();
    setTimeout(() => { if (NET.peer === peer){ try{ peer.reconnect(); }catch(e){ netStop(); startHost(); } } }, 3000);
  });
}

/* ----- player ----- */
function startJoin(pw){
  netStop();
  S.joinErr = "";
  if (!netReady()){ S.joinErr = "Group play couldn't load. Check your internet connection and reload the page."; render(); return; }
  NET.mode = "player"; NET.pw = pw; S.roomState = "connecting"; render();
  const peer = NET.peer = newPeer();
  keepAlive(peer);
  peer.on("open", () => { if (NET.peer === peer) dialHost(); });
  peer.on("error", err => {
    if (NET.peer !== peer) return;
    if (S.role === "player"){ S.roomState = "off"; renderStatus(); scheduleRejoin(); return; }
    S.joinErr = err && err.type === "peer-unavailable"
      ? "No open room uses that password. Check the word with the host, and make sure they tapped Open the room."
      : "Couldn't connect. If you're on school or hospital Wi-Fi, switch to phone data and try again.";
    netStop(); render();
  });
  clearTimeout(S.joinTimer);
  S.joinTimer = setTimeout(() => {
    if (NET.peer === peer && S.role !== "player"){
      S.joinErr = "The room didn't answer. If you're on school or hospital Wi-Fi, switch to phone data and try again.";
      netStop(); render();
    }
  }, 20000);
}
function dialHost(){
  if (!NET.peer || NET.peer.destroyed || NET.mode !== "player") return;
  try{ wireConn(NET.peer.connect(PEER_PREFIX + NET.pw, { reliable: true })); }catch(e){ scheduleRejoin(); }
}
/* The host's tab reloaded or a phone slept: keep redialing quietly. */
function scheduleRejoin(){
  if (NET.mode !== "player" || S.role !== "player" || NET.retry) return;
  NET.retry = setTimeout(() => {
    NET.retry = null;
    if (NET.mode !== "player" || NET.conns.size) return;
    const p = NET.peer;
    if (p && p.open) dialHost();
    else if (p && !p.destroyed){ try{ p.reconnect(); }catch(e){} scheduleRejoin(); }
  }, 3000);
}
function checkJoined(){
  for (const h of NET.remote.values()){
    if (h && h.role === "host" && h.sess && h.phase !== "closed" && (!h.lk || h.lk === pwLock(h.sess, NET.pw))){
      clearTimeout(S.joinTimer);
      S.keys[h.sess] = NET.pw; LS.set("keys", S.keys); S.pwDraft = "";
      playerJoin(h.sess); return;
    }
  }
}
function doConnect(){
  const f = $("#pwIn"), pw = normPw(f ? f.value : S.pwDraft);
  if (!pw){ S.joinErr = "Type the password the host gave you."; render(); return; }
  S.pwDraft = pw; startJoin(pw);
}


function onSync(){
  if (S.G && S.G.phase === "end" && S.role !== "player"){ renderStatus(); return; }
  if (S.view === "join" && S.role !== "player"){ renderStatus(); return; }
  if ((S.role === "host") && S.G) hostIngest();
  else if (S.role === "player") playerIngest();
  else if (S.view === "join") render();
  renderStatus();
}
const FRESH = 10 * 60 * 1000;
function hostsList(){
  const by = {};
  if (S.room) for (const p of S.room.peers()){ const h = p.presence; if (!p.sameTab && h && h.role === "host" && h.sess) by[h.sess] = h; }
  const now = Date.now();
  for (const h of S.dbLive){ if (h && h.role === "host" && h.sess && now - (h.hb || 0) < FRESH && (!by[h.sess] || (h.rev || 0) > (by[h.sess].rev || 0))) by[h.sess] = h; }
  if (S.G) delete by[S.G.sess];
  return Object.values(by).filter(h => h.phase !== "end" && h.phase !== "closed").sort((a, b) => (b.t || 0) - (a.t || 0));
}

/* ================= HOST / SOLO ENGINE ================= */
function newGame(role){
  const sess = newId() + newId();
  const deck = buildDeck(S.setup.topics, S.setup.mode, sess, S.seen);
  S.G = { sess, role, hostPlays: role === "solo" ? true : S.hostPlays, hostNick: S.nick || "Host",
    topics: S.setup.topics.slice(), mode: S.setup.mode, queue: deck, base: deck.length, i: 0, rev: 0,
    phase: role === "solo" ? "q" : "lobby", ans: {}, players: {}, revealed: [], fu: {}, fuFrom: {}, fuN: 0, votes: {}, t: Date.now(), pw: role === "solo" ? null : newPw() };
  if (S.G.hostPlays) S.G.players.me = { n: S.nick || "Me", c: 0 };
  S.role = role; S.draft = null; saveG();
  if (role !== "solo"){ ansUnsub && ansUnsub(); ansUnsub = null; subscribeAns(); }
}
function saveG(){ if (S.G) LS.set("game", S.G); }
function curQid(){ return S.G.queue[S.G.i]; }
const ALIVE = 150 * 1000;
/* every player record we can hear, from either channel, newest wins */
function playerRecs(){
  if (!S.G || S.G.role === "solo") return [];
  const by = {}, now = Date.now(), ok = r => !S.G.pw || r.k === pwKey(S.G.sess, r.pid, S.G.pw);
  if (S.room) for (const p of S.room.peers()){ const r = p.presence; if (!p.sameTab && r && r.role === "player" && r.host === S.G.sess && r.pid && ok(r)){ by[r.pid] = Object.assign({ live: true }, r); } }
  for (const r of S.dbAns){ if (!r || r.host !== S.G.sess || !r.pid || !ok(r)) continue; const alive = now - (r.hb || 0) < ALIVE; const cur = by[r.pid];
    if (!cur || (r.t || 0) > (cur.t || 0)) by[r.pid] = Object.assign({ live: (cur && cur.live) || alive }, r); }
  return Object.values(by);
}
function activeKeys(){
  const ks = playerRecs().filter(r => r.live).map(r => r.pid);
  if (S.G.hostPlays) ks.unshift("me");
  return ks;
}
function hostIngest(){
  const G = S.G; if (!G) return;
  let changed = false; const qid = curQid();
  for (const r of playerRecs()){
    const k = r.pid;
    if (!G.players[k]){ G.players[k] = { n: String(r.nick || "Player").slice(0, 24), c: Object.keys(G.players).length }; changed = true; }
    if (G.phase === "q" && r.qid === qid && r.a != null){
      G.ans[k] = G.ans[k] || {};
      if (JSON.stringify(G.ans[k][qid]) !== JSON.stringify(r.a)){ G.ans[k][qid] = r.a; changed = true; }
    }
    if (G.phase === "reveal" && r.vote && r.vote.q === qid && G.votes[k] !== r.vote.v){ G.votes[k] = r.vote.v; changed = true; }
  }
  if (changed) saveG();
  maybeAuto();
  render(); broadcast();
}
function allAnswered(){
  const G = S.G, qid = curQid(), ks = activeKeys();
  return ks.length > 0 && ks.every(k => G.ans[k] && G.ans[k][qid] != null);
}
let autoTimer = null;
function maybeAuto(){
  const G = S.G; if (!G) return;
  clearTimeout(autoTimer);
  if (G.phase === "q" && allAnswered()) autoTimer = setTimeout(() => { if (S.G && S.G.phase === "q" && allAnswered()) hostReveal(); }, 700);
  if (G.phase === "reveal" && G.role !== "solo"){
    const ks = activeKeys(), qid = curQid();
    const allNext = ks.length > 0 && ks.every(k => (k === "me" ? S.myVote[qid] : G.votes[k]) === "next");
    if (allNext) autoTimer = setTimeout(() => { if (S.G && S.G.phase === "reveal") hostNext(); }, 900);
  }
}
function hostStart(){ S.G.phase = "q"; saveG(); render(); broadcast(); }
function hostSubmitOwn(a){ const G = S.G, qid = curQid(); G.ans.me = G.ans.me || {}; G.ans.me[qid] = a; saveG(); if (G.role === "solo") hostReveal(); else { maybeAuto(); render(); broadcast(); } }
function hostReveal(){
  const G = S.G; if (G.phase !== "q") return;
  const qid = curQid(), q = getQ(qid);
  G.phase = "reveal"; G.votes = {};
  if (!G.revealed.includes(qid)){ G.revealed.push(qid); markSeen(qid); }
  const missed = Object.keys(G.ans).some(k => G.ans[k][qid] != null && !grade(q, G.ans[k][qid]));
  if (missed && !G.fu[qid]){
    const f = pickFollowup(q, G.queue, G.sess, G.fuN++, S.seen);
    if (f){ const pos = Math.min(G.i + 3, G.queue.length); G.queue.splice(pos, 0, f); G.fu[qid] = f; G.fuFrom[f] = qid; }
  }
  if (S.G.hostPlays && G.ans.me && G.ans.me[qid] != null) recordHist(q, G.ans.me[qid]);
  saveG(); render(); broadcast(); maybeAuto();
}
function hostNext(){
  const G = S.G; clearTimeout(autoTimer);
  if (G.i + 1 >= G.queue.length){ hostEnd(); return; }
  G.i++; G.phase = "q"; G.votes = {}; S.draft = null; saveG(); render(); broadcast();
  try{ window.scrollTo({ top: 0, behavior: "smooth" }); }catch(e){}
}
function hostClose(){
  const G = S.G; if (!G) return;
  G.phase = "closed"; broadcast(true);
  const p = hostPayload(); p.phase = "closed"; p.hb = Date.now(); p.rev = (G.rev || 0) + 1; dbPut("live", "h-" + G.sess, p);
  setTimeout(() => pres({ role: null, phase: null, roster: null, rv: null, sum: null, qid: null, sess: null }), 1500);
  setTimeout(netStop, 2000);
  LS.del("game"); S.G = null; S.role = null; S.view = "home"; S.toast = "Room closed."; render();
}
async function hostEnd(){
  const G = S.G; G.phase = "end"; saveG(); render(); broadcast();
  if (S.db && G.revealed.length){
    try{ await S.db.collection("results").doc("r-" + G.sess).set({ when: new Date().toISOString(), mode: G.role, topics: G.topics, coverage: summarize(G).tp, missedConcepts: [...new Set(missedList(G).map(m => m.q.t + ":" + m.q.c))] }); }catch(e){}
  }
}
let lastCast = "";
function hostPayload(){
  const G = S.G;
  const qid = G.phase === "q" || G.phase === "reveal" ? curQid() : null;
  const roster = Object.keys(G.players).map(k => ({ p: k, n: G.players[k].n, c: G.players[k].c, a: !!(qid && G.ans[k] && G.ans[k][qid] != null), r: G.phase === "reveal" && (k === "me" ? S.myVote[qid] : G.votes[k]) === "next" }));
  const p = { role: "host", nick: G.hostNick, sess: G.sess, phase: G.phase, qid, i: G.i, n: G.queue.length, t: G.t, fu: qid ? (G.fuFrom[qid] ? 1 : 0) : 0, roster, rv: null, sum: null, lk: G.pw ? pwLock(G.sess, G.pw) : null };
  if (G.phase === "reveal") p.rv = { fu: G.fu[qid] ? 1 : 0, talk: talkCount() };
  if (G.phase === "end") p.sum = { tp: summarize(G).tp };
  return p;
}
function broadcast(force){
  const G = S.G; if (!G || G.role === "solo") return;
  const p = hostPayload(), key = JSON.stringify(p);
  if (key !== lastCast){ G.rev = (G.rev || 0) + 1; lastCast = key; saveG(); }
  else if (!force) return;
  p.rev = G.rev; p.hb = Date.now();
  pres(p);
  dbPut("live", "h-" + G.sess, p);
}

/* ================= PLAYER ================= */
function playerJoin(sess){
  S.role = "player"; S.hostSess = sess; S.view = "play"; S.draft = null; S.joinedAt = Date.now();
  LS.set("lastHost", sess);
  playerIngest(); playerSync(true);
}
function hostState(){
  let best = null;
  if (S.room) for (const p of S.room.peers()){ const h = p.presence; if (h && h.role === "host" && h.sess === S.hostSess && (!best || (h.rev || 0) >= (best.rev || 0))) best = h; }
  for (const h of S.dbLive){ if (h && h.role === "host" && h.sess === S.hostSess && (!best || (h.rev || 0) > (best.rev || 0))) best = h; }
  return best;
}
function playerIngest(){
  const prev = S.H; S.H = hostState();
  const H = S.H;
  if (H){
    if (!prev || prev.sess !== H.sess || prev.qid !== H.qid){ S.draft = null; }
    if (S.histSess !== H.sess){ S.histSess = H.sess; S.hist = {}; S.sent = {}; S.myVote = {}; }
    if (H.phase === "reveal" && H.qid && S.sent[H.qid] != null){ recordHist(getQ(H.qid), S.sent[H.qid], H.sess); }
    if (H.phase === "reveal" && H.qid && S.lastSeenQ !== H.sess + H.qid){ S.lastSeenQ = H.sess + H.qid; markSeen(H.qid); }
    playerSync();
  }
  render();
}
let lastSync = "", lastT = 0;
function playerSync(heartbeat){
  if (S.role !== "player" || !S.hostSess) return;
  const H = S.H, qid = H ? H.qid : null;
  const r = { role: "player", pid: S.pid, nick: S.nick, host: S.hostSess, sess: S.hostSess, k: pwKey(S.hostSess, S.pid, S.keys[S.hostSess] || ""), qid, a: qid && S.sent[qid] != null ? S.sent[qid] : null, vote: qid && S.myVote[qid] ? { q: qid, v: S.myVote[qid] } : null };
  const key = JSON.stringify(r);
  if (key !== lastSync){ lastSync = key; lastT = Date.now(); }
  else if (!heartbeat) return;
  r.t = lastT; r.hb = Date.now();
  pres(r);
  dbPut("ans", S.hostSess + "-" + S.pid, r);
}
function playerSubmit(a){ const H = S.H; if (!H || H.phase !== "q") return; S.sent[H.qid] = a; playerSync(); render(); }
function vote(v){
  const qid = S.role === "player" ? S.H && S.H.qid : curQid();
  if (!qid) return; S.myVote[qid] = v;
  if (S.role === "player") playerSync();
  else { broadcast(); maybeAuto(); }
  render();
}
function markSeen(qid){ if (!qid || qid.startsWith("g~")) return; S.seen[qid] = (S.seen[qid] || 0) + 1; LS.set("seen", S.seen); }
function recordHist(q, a, sess){ const ok = grade(q, a); if (S.hist[q.id] && S.hist[q.id].seen) return; S.hist[q.id] = { ok, t: q.t, c: q.c, seen: 1 }; }
/* keep both sides visible to each other */
setInterval(() => { if (S.role === "player") playerSync(true); if (S.role === "host" && S.G) { broadcast(true); hostIngest(); } }, 15000);

/* ---------- connection status ---------- */
function connOk(){ return S.roomState === "on"; }
function renderStatus(){
  const el = $("#conn"); if (!el) return;
  const st = S.roomState;
  el.innerHTML = st === "connecting" ? `<span class="dot" style="background:var(--amber)"></span>Connecting…`
    : st === "on" ? `<span class="dot" style="background:var(--ok)"></span>Connected`
    : st === "off" ? `<span class="dot" style="background:var(--amber)"></span>Reconnecting…`
    : st === "err" ? `<span class="dot" style="background:var(--bad)"></span>Group play unavailable`
    : "";
}

/* ================= RENDER ================= */
function render(){
  const v = S.view, el = $("#scr");
  const ae = document.activeElement, focusId = ae && ae.id && ae.tagName === "INPUT" ? ae.id : null, selS = focusId ? ae.selectionStart : null;
  renderInner(v, el);
  if (focusId){ const f = document.getElementById(focusId); if (f){ f.focus(); try{ f.setSelectionRange(selS, selS); }catch(e){} } }
}
function renderInner(v, el){
  $("#homeBtn").hidden = v === "home";
  if (v === "home") el.innerHTML = vHome();
  else if (v === "name") el.innerHTML = vName();
  else if (v === "setup") el.innerHTML = vSetup();
  else if (v === "lobby") el.innerHTML = vLobby();
  else if (v === "join") el.innerHTML = vJoin();
  else if (v === "play") el.innerHTML = playView();
  renderStatus();
  bind(v);
}
function accessNote(){ return ""; }
function heardNote(c){
  if (S.role !== "player" || !c || !S.joinedAt || Date.now() - S.joinedAt < 12000) return "";
  if ((c.roster || []).some(r => r.p === S.pid)) return "";
  return `<div class="banner"><b>The host's screen doesn't see you yet.</b> Keep this page open; it usually clears in a few seconds.</div>`;
}
function roomNote(){
  if (S.roomState === "err") return `<div class="banner stack" style="gap:6px"><p><b>This browser can't run group play.</b></p><p>Try Chrome or Safari. Solo mode still works here.</p></div>`;
  if (S.roomState === "off") return `<div class="banner stack" style="gap:6px"><p><b>Lost the connection. Trying again…</b></p><p>If it doesn't come back in a few seconds, switch from school or hospital Wi-Fi to phone data. Your place in the game is saved.</p></div>`;
  return "";
}
function blueprintCard(){
  const rows = Object.keys(TOPICS).map(t => { const n = qCount(t), b = BLUEPRINT[t] || [0, 0];
    return `<div class="bar" style="grid-template-columns:minmax(0,1fr) auto auto"><span class="lbl" style="white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;color:var(--ink)">${esc(TOPICS[t])}</span><span class="mono muted" style="font-size:13px">${b[0]} on exam${b[1] ? " · " + b[1] + " CJ" : ""}</span>${n ? `<span class="pill ok">${n} ready</span>` : `<span class="pill">Coming soon</span>`}</div>`; }).join("");
  return `<div class="card stack" style="gap:10px"><div class="eyebrow">Exam 4 blueprint · ${READY.length} of ${Object.keys(TOPICS).length} lectures loaded</div><div class="stack" style="gap:8px">${rows}</div></div>`;
}
function vHome(){
  const saved = LS.get("game", null);
  const resume = saved && saved.phase !== "end" && saved.revealed && saved.revealed.length ? `<div class="card row" style="justify-content:space-between"><div><div class="eyebrow">Unfinished game on this device</div><p>${esc(saved.revealed.length)} answered · ${esc(saved.queue.length - saved.i)} left</p></div><button class="btn primary" data-act="resume">Resume</button></div>` : "";
  const toast = S.toast ? `<div class="banner" role="status">${esc(S.toast)}</div>` : ""; S.toast = "";
  return `<div class="stack" style="gap:20px">${toast}
    <div class="stack" style="gap:8px"><h1>Review everything on Exam 4, together.</h1>

/* ---------- play view (host, solo, player) ---------- */
function ctx(){

function playView(){

function readyRoster(c){

function talkCount(){ const G = S.G, qid = curQid(); return Object.keys(G.votes).filter(k => G.votes[k] === "talk").length + (S.myVote[qid] === "talk" ? 1 : 0); }

/* ---------- end / review ---------- */
function missedList(G){
  const out = [];
  for (const qid of G.revealed){
    const q = getQ(qid); const who = [];
    for (const k of Object.keys(G.ans)){ const a = G.ans[k][qid]; if (a != null && !grade(q, a)) who.push(1); }
    if (who.length) out.push({ q, who, qid });
  }
  return out;
}
function myPer(hist){
  const per = {}; let c = 0, n = 0;
  for (const id of Object.keys(hist)){ const h = hist[id]; per[h.t] = per[h.t] || [0, 0]; per[h.t][1]++; n++; if (h.ok){ per[h.t][0]++; c++; } }
  return { per, c, n };
}
function chartHTML(tp, mine){
  if (!tp || !tp.length) return "";

function reviewHTML(items, sess, shared){

function notReached(tp){

function myTile(c, n){

function endView(c){

    }
  }
  const again = S.role !== "player" ? `<div class="row"><button class="btn primary big" data-act="again">New game</button>${S.role === "host" ? `<button class="btn danger" data-act="close">Close room</button>` : ""}</div>` : `<div class="row"><button class="btn big" data-act="toJoin">Join another game</button></div>`;
  return `<div class="stack" style="gap:18px"><div class="stack" style="gap:6px"><div class="eyebrow">Round complete</div><h1>Here's what to review.</h1></div>${html}${notReached(tp)}${again}</div>`;
}



/* ---------- events ---------- */
let lastBound = null;
function bind(v){
  const n = $("#nick"); if (n && lastBound !== "name") n.focus();
  lastBound = v;
  const hp = $("#hp"); if (hp) hp.onchange = () => { S.hostPlays = hp.checked; };
  document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = () => { S.setup.mode = r.value; render(); });
  const pi = $("#pwIn"); if (pi){ pi.oninput = () => { S.pwDraft = pi.value; }; pi.onkeydown = e => { if (e.key === "Enter") doConnect(); }; }
  const ni = $("#numIn"); if (ni){ ni.oninput = () => { S.draft = ni.value; }; ni.onkeydown = e => { if (e.key === "Enter") doSubmit(); }; }
}
function doSubmit(){
  const c = ctx(); const q = getQ(c.qid);
  let a = S.draft != null ? S.draft : c.mine;
  if (q.type === "num"){ const ni = $("#numIn"); a = ni ? ni.value.trim() : a; if (!isFinite(parseNum(a))){ ni && (ni.setCustomValidity("Enter a number"), ni.reportValidity()); return; } }
  if (q.type === "sata" && (!Array.isArray(a) || !a.length)) return;
  if (q.type === "mc" && a == null) return;
  S.draft = null;
  if (S.role === "player") playerSubmit(a); else hostSubmitOwn(a);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "pick"){ S.pendingRole = b.dataset.role; S.view = "name"; render(); }
  else if (act === "nameNext"){
    const v = ($("#nick").value || "").trim().slice(0, 20); if (!v){ $("#nick").focus(); return; }
    S.nick = v; LS.set("nick", v);
    if (S.pendingRole === "player"){ S.role = null; S.joinErr = ""; S.view = "join"; render(); const f = $("#pwIn"); if (f) f.focus(); }
    else { S.view = "setup"; render(); }
  }
  else if (act === "topic"){ const t = b.dataset.t; if (!READY.includes(t)) return; const i = S.setup.topics.indexOf(t); if (i >= 0) S.setup.topics.splice(i, 1); else S.setup.topics.push(t); S.setup.topics.sort((a, b) => Object.keys(TOPICS).indexOf(a) - Object.keys(TOPICS).indexOf(b)); render(); }
  else if (act === "create"){
    newGame(S.pendingRole);
    S.myVote = {}; S.hist = {}; LS.set("hist", {});
    S.view = S.G.role === "solo" ? "play" : "lobby"; render(); broadcast();
    if (S.G.role === "host") startHost();
  }
  else if (act === "start"){ hostStart(); S.view = "play"; render(); }
  else if (act === "copy"){ const t = inviteText(S.G); try{ navigator.clipboard.writeText(t).then(() => { b.textContent = "Copied"; }, () => showInvite()); }catch(err){ showInvite(); } }
  else if (act === "join"){
    const sess = b.dataset.sess, h = hostsList().find(x => x.sess === sess);
    if (h && h.lk && S.keys[sess] && pwLock(sess, S.keys[sess]) === h.lk){ playerJoin(sess); return; }
    S.unlock = sess; S.pwErr = ""; S.pwDraft = ""; render(); const f = $("#pwIn"); if (f) f.focus();
  }
  else if (act === "unlock"){ tryUnlock(b.dataset.sess); }
  else if (act === "cancelUnlock"){ S.unlock = null; S.pwErr = ""; render(); }
  else if (act === "connect"){ doConnect(); }
  else if (act === "cancelJoin"){ netStop(); S.joinErr = ""; render(); }
  else if (act === "fixconn"){ (async () => { try{ if (S.perms){ const st = await S.perms.request(); if (Object.values(st || {}).some(v => v === "denied")){ try{ await S.perms.manage(); }catch(e){} } } }catch(e){} location.reload(); })(); }
  else if (act === "toJoin"){ pres({ role: null, host: null, sess: null, qid: null, a: null, vote: null }); netStop(); S.role = null; S.H = null; S.hostSess = null; S.joinErr = ""; S.view = "join"; render(); }
  else if (act === "opt"){
    const c = ctx(); const q = getQ(c.qid); const o = +b.dataset.o;
    let d = S.draft != null ? S.draft : c.mine;
    if (q.type === "sata"){ d = Array.isArray(d) ? d.slice() : []; const i = d.indexOf(o); if (i >= 0) d.splice(i, 1); else d.push(o); }
    else d = o;
    S.draft = d; render();
  }
  else if (act === "submit"){ doSubmit(); }
  else if (act === "reveal"){ hostReveal(); }
  else if (act === "next"){ hostNext(); }
  else if (act === "vote"){ vote(b.dataset.v); }
  else if (act === "close"){ if (b.dataset.sure){ hostClose(); } else { b.dataset.sure = "1"; b.textContent = "Tap again to close the room"; } }
  else if (act === "end"){ if (b.dataset.sure){ hostEnd(); } else { b.dataset.sure = "1"; b.textContent = "Tap again to end the round"; } }
  else if (act === "again"){ if (S.role === "host"){ pres({ role: null, phase: null, roster: null, rv: null, sum: null, qid: null, sess: null }); setTimeout(netStop, 800); } S.G = null; LS.del("game"); S.view = "setup"; S.pendingRole = S.pendingRole || "solo"; render(); }
  else if (act === "resume"){ S.G = LS.get("game", null); if (!S.G) return; S.role = S.G.role; S.pendingRole = S.G.role; S.hostPlays = S.G.hostPlays; S.view = S.G.phase === "lobby" ? "lobby" : "play"; render(); broadcast(); if (S.G.role === "host") startHost(); }
});
document.addEventListener("toggle", e => { const d = e.target; if (!d || !d.dataset || !d.dataset.k) return; if (d.open) S.openRev.add(d.dataset.k); else S.openRev.delete(d.dataset.k); }, true);
$("#homeBtn").onclick = () => {
  if (S.role === "host" || S.role === "solo"){ if (S.G) saveG(); pres({ role: null, phase: null, roster: null, rv: null, sum: null, qid: null }); }
  if (S.role === "player") pres({ role: null, host: null, sess: null, qid: null, a: null, vote: null });
  setTimeout(netStop, 500);
  S.role = null; S.G = null; S.H = null; S.view = "home"; render();
};
function showInvite(){ const u = $("#url"); if (!u) return; u.hidden = false; selectUrl(); const n = $("#copyNote"); if (n) n.textContent = "Copy the text below"; }
function tryUnlock(sess){
  const f = $("#pwIn"), pw = normPw(f ? f.value : S.pwDraft);
  const h = hostsList().find(x => x.sess === sess);
  if (!h){ S.pwErr = "That room just closed."; render(); return; }
  if (!pw){ S.pwErr = "Type the password the host gave you."; render(); return; }
  if (h.lk && pwLock(sess, pw) !== h.lk){ S.pwErr = "That password doesn't match. Check with the host and try again."; S.pwDraft = pw; render(); const g = $("#pwIn"); if (g){ g.focus(); g.select(); } return; }
  S.keys[sess] = pw; LS.set("keys", S.keys); S.unlock = null; S.pwErr = ""; S.pwDraft = "";
  playerJoin(sess);
}
function selectUrl(){ const u = $("#url"); if (!u) return; const r = document.createRange(); r.selectNodeContents(u); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
setInterval(() => { if (S.hist) LS.set("hist", S.hist); }, 4000);
{ const g = LS.get("game", null); if (g && (!Array.isArray(g.queue) || g.queue.some(id => !BYID[id]))) LS.del("game"); }
render();
</script>
